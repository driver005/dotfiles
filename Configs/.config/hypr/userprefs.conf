# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant = intl
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}


if hyprctl monitors | grep -q "HDMI-A-1"; then
  cursor:allow_dumb_copy = true

  env = AQ_DRM_DEVICES,/dev/dri/card0
  env = WLR_DRM_DEVICES,/dev/dri/card0
  env = AQ_FORCE_LINEAR_BLIT,0

  misc:vfr = false # Disable variable refresh rate (VRR) if you experience stuttering or tearing

  exec-once = sh -c 'notify-send "GPU Config" "WLR_DRM_DEVICES is set to: $WLR_DRM_DEVICES"'
  exec-once = sh -c 'echo "Variable check: $WLR_DRM_DEVICES" > ~/hypr_check.txt'
fi


exec-once = ~/scripts/switcher.sh
